<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <div class="header">
        <h2 id="spotNome">A carregar...</h2>
        <span id="scoreBadge" class="badge">?</span>
      </div>

      <div class="info-grid">
        <div class="info-card">
          <strong>🌓 Maré</strong>
          <p id="mare"></p>
        </div>
        <div class="info-card">
          <strong>🌊 Ondas</strong>
          <p id="ondas"></p>
        </div>
        <div class="info-card">
          <strong>💨 Vento</strong>
          <p id="vento"></p>
        </div>
        <div class="info-card">
          <strong>🌡️ Água</strong>
          <p id="tempAgua"></p>
        </div>
      </div>

      <div class="solunar-section">
        <div class="info-card solunar-card">
          <strong>☀️🌙 Tabela Solunar</strong>
          <p id="solunar"></p>
        </div>
      </div>

      <div class="recomendacao" id="recomendacao"></div>

      <select id="spotSelect">
        <option value="1">Costa da Caparica</option>
        <option value="2">Ericeira</option>
        <option value="3">Peniche</option>
        <option value="4">Nazaré</option>
        <option value="5">Sagres</option>
        <option value="6">Sesimbra</option>
        <option value="7">Aveiro</option>
      </select>

      <div class="feedback-section">
        <div class="feedback-toggle" id="feedbackToggle">
          💬 Feedback
        </div>
        <div class="feedback-form hidden" id="feedbackForm">
          <textarea
            id="feedbackText"
            placeholder="Partilha a tua opinião ou sugestão com a equipa de desenvolvimento..."
            rows="4"
          ></textarea>
          <button id="sendFeedbackBtn" class="btn" type="button">
            Enviar Feedback
          </button>
        </div>
      </div>

      <div class="billing-section">
        
        <div class="billing-actions" id="authChoice">
          <button id="registerBtn" class="btn" type="button">
            Criar conta FREE
          </button>
          <button id="loginBtn" class="btn secondary" type="button">
            Entrar
          </button>
        </div>

        <div id="authForm" class="hidden">
          <input
            id="authEmail"
            type="email"
            placeholder="Email"
            autocomplete="email"
          />
          <input
            id="authPassword"
            type="password"
            placeholder="Password (mín. 6 caracteres)"
            autocomplete="current-password"
          />
          <div class="billing-actions">
            <button id="authSubmitBtn" class="btn" type="button">
              Continuar
            </button>
            <button id="cancelAuthBtn" class="btn secondary" type="button">
              Cancelar
            </button>
          </div>
        </div>

        <div id="billingActionsPanel" class="hidden">
          <div class="billing-actions">
            <button id="statusBtn" class="btn" type="button">Ver estado</button>
            <div class="upgrade-dropdown">
              <button id="upgradeBtn" class="btn" type="button">
                Upgrade
              </button>
              <div id="upgradeMenu" class="dropdown-menu hidden">
                <div class="dropdown-item" data-plan="monthly">
                  <span class="plan-label">Mensal</span>
                  <span class="plan-price" id="monthlyPrice">...</span>
                </div>
                <div class="dropdown-item" data-plan="yearly">
                  <span class="plan-label">Anual</span>
                  <span class="plan-price" id="yearlyPrice">...</span>
                </div>
              </div>
            </div>
          </div>
          <div class="billing-actions">
            <button id="portalBtn" class="btn secondary" type="button">
              Gerir plano
            </button>
            <button id="logoutBtn" class="btn danger" type="button">
              Sair
            </button>
          </div>
        </div>
        <p id="billingMessage" class="billing-message"></p>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
