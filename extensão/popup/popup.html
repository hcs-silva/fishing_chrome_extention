<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <div class="header">
        <h2 id="spotNome">A carregar...</h2>
        <span id="scoreBadge" class="badge">?</span>
      </div>

      <div class="info-grid">
        <div class="info-card">
          <strong>🌓 Maré</strong>
          <p id="mare"></p>
        </div>
        <div class="info-card">
          <strong>🌊 Ondas</strong>
          <p id="ondas"></p>
        </div>
        <div class="info-card">
          <strong>💨 Vento</strong>
          <p id="vento"></p>
        </div>
        <div class="info-card">
          <strong>🌡️ Água</strong>
          <p id="tempAgua"></p>
        </div>
      </div>

      <div class="solunar-section">
        <div class="info-card solunar-card">
          <strong>☀️🌙 Tabela Solunar</strong>
          <p id="solunar"></p>
        </div>
      </div>

      <div class="recomendacao" id="recomendacao"></div>

      <select id="spotSelect">
        <option value="1">Costa da Caparica</option>
        <option value="2">Ericeira</option>
        <option value="3">Peniche</option>
        <option value="4">Nazaré</option>
        <option value="5">Sagres</option>
        <option value="6">Sesimbra</option>
        <option value="7">Aveiro</option>
      </select>

      <div class="custom-spots-section">
        <div class="custom-spots-toggle" id="customSpotsToggle">
          📍 Os Meus Spots
        </div>
        <div class="custom-spots-panel hidden" id="customSpotsPanel">
          <div id="customSpotsList" class="custom-spots-list"></div>
          <div class="add-spot-options">
            <button id="addByMapBtn" class="btn btn-small">
              🗺️ Adicionar no Mapa
            </button>
            <button id="addByCoordsBtn" class="btn btn-small">
              📌 Adicionar por Coordenadas
            </button>
          </div>
          
          <!-- Map interface -->
          <div id="mapInterface" class="map-interface hidden">
            <div class="map-instructions">
              Clica no mapa para escolher a localização do spot
            </div>
            <div id="map" class="map-container"></div>
            <div class="map-form">
              <input
                id="mapSpotName"
                type="text"
                placeholder="Nome do spot"
                maxlength="50"
              />
              <div class="map-coords">
                <span>Lat: <span id="selectedLat">-</span></span>
                <span>Lng: <span id="selectedLng">-</span></span>
              </div>
              <div class="billing-actions">
                <button id="saveMapSpotBtn" class="btn">Guardar Spot</button>
                <button id="cancelMapBtn" class="btn secondary">Cancelar</button>
              </div>
            </div>
          </div>

          <!-- Coordinates interface -->
          <div id="coordsInterface" class="coords-interface hidden">
            <div class="coords-form">
              <input
                id="coordsSpotName"
                type="text"
                placeholder="Nome do spot"
                maxlength="50"
              />
              <input
                id="coordsLat"
                type="number"
                step="0.000001"
                placeholder="Latitude (ex: 38.655)"
                min="-90"
                max="90"
              />
              <input
                id="coordsLng"
                type="number"
                step="0.000001"
                placeholder="Longitude (ex: -9.230)"
                min="-180"
                max="180"
              />
              <div class="billing-actions">
                <button id="saveCoordsSpotBtn" class="btn">Guardar Spot</button>
                <button id="cancelCoordsBtn" class="btn secondary">Cancelar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="feedback-section">
        <div class="feedback-toggle" id="feedbackToggle">
          💬 Feedback
        </div>
        <div class="feedback-form hidden" id="feedbackForm">
          <textarea
            id="feedbackText"
            placeholder="Partilha a tua opinião ou sugestão com a equipa de desenvolvimento..."
            rows="4"
          ></textarea>
          <button id="sendFeedbackBtn" class="btn" type="button">
            Enviar Feedback
          </button>
        </div>
      </div>

      <div class="billing-section">
        
        <div class="billing-actions" id="authChoice">
          <button id="registerBtn" class="btn" type="button">
            Criar conta FREE
          </button>
          <button id="loginBtn" class="btn secondary" type="button">
            Entrar
          </button>
        </div>

        <div id="authForm" class="hidden">
          <input
            id="authEmail"
            type="email"
            placeholder="Email"
            autocomplete="email"
          />
          <input
            id="authPassword"
            type="password"
            placeholder="Password (mín. 6 caracteres)"
            autocomplete="current-password"
          />
          <div class="billing-actions">
            <button id="authSubmitBtn" class="btn" type="button">
              Continuar
            </button>
            <button id="cancelAuthBtn" class="btn secondary" type="button">
              Cancelar
            </button>
          </div>
        </div>

        <div id="billingActionsPanel" class="hidden">
          <div class="billing-actions">
            <button id="statusBtn" class="btn" type="button">Ver estado</button>
            <div class="upgrade-dropdown">
              <button id="upgradeBtn" class="btn" type="button">
                Upgrade
              </button>
              <div id="upgradeMenu" class="dropdown-menu hidden">
                <div class="dropdown-item" data-plan="monthly">
                  <span class="plan-label">Mensal</span>
                  <span class="plan-price" id="monthlyPrice">...</span>
                </div>
                <div class="dropdown-item" data-plan="yearly">
                  <span class="plan-label">Anual</span>
                  <span class="plan-price" id="yearlyPrice">...</span>
                </div>
              </div>
            </div>
          </div>
          <div class="billing-actions">
            <button id="portalBtn" class="btn secondary" type="button">
              Gerir plano
            </button>
            <button id="logoutBtn" class="btn danger" type="button">
              Sair
            </button>
          </div>
        </div>
        <p id="billingMessage" class="billing-message"></p>
      </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
